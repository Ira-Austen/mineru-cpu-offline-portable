name: 构建并测试 MinerU CPU 离线包
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '*.py', '*.ps1', '*.json', '*.lock', '.github/workflows/**', 'README.md']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如 v4.0.12，留空按默认)'
        required: false
        default: ''
      draft:
        description: '是否发布为草稿版本 (Draft)'
        type: boolean
        default: false
      prerelease:
        description: '是否标记为预发布版本 (Prerelease)'
        type: boolean
        default: false
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 复用 GGUF（缓存键独立于 MinerU 版本）
        uses: actions/cache@v4
        with:
          path: input-models
          key: gguf-${{ hashFiles('gguf-models.json') }}
      - name: 复用 ONNX（更新程序不会使模型缓存失效）
        uses: actions/cache@v4
        with:
          path: work/shared-models
          key: onnx-${{ hashFiles('onnx-models.json') }}
      - name: 复用 uv 依赖与 Python 安装缓存（加速构建）
        uses: actions/cache@v4
        with:
          path: work/uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('requirements-*.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: 复用 Debian 基础库缓存
        uses: actions/cache@v4
        with:
          path: |
            work/*.deb
          key: deb-pkgs-${{ hashFiles('build.ps1') }}
      - name: 下载缺失模型并校验 GGUF
        shell: pwsh
        run: uv run --no-project --python 3.12 download_gguf.py --dest input-models
      - name: 构建六个离线包及单元测试
        shell: pwsh
        run: ./build.ps1 -GgufDirectory ./input-models
      - name: 校验压缩包与文件清单
        shell: pwsh
        run: uv run --no-project --python 3.12 verify_archives.py --output output
      - name: 解压至中文空格路径，测试官方 WebUI 与 CPU OCR
        shell: pwsh
        run: |
          Expand-Archive output/MinerU-Windows-x64-Full.zip 'extracted/中文 空格'
          $bundle = Join-Path $PWD 'extracted/中文 空格/MinerU-Windows-x64-Full'
          & "$bundle/runtime/python/python.exe" tests/smoke_portable.py "$bundle" --advanced --output output/windows-full-test.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows 完整包测试失败' }
          Expand-Archive output/MinerU-Windows-x64-Runtime.zip extracted
          $runtime = Join-Path $PWD 'extracted/MinerU-Windows-x64-Runtime'
          & "$runtime/runtime/python/python.exe" tests/smoke_portable.py "$runtime" --gguf-dir "$bundle/models/GGUF" --onnx-dir "$bundle/models/MinerU-4_models_onnx" --output output/windows-external-models-test.json
          if ($LASTEXITCODE -ne 0) { throw 'Windows 外部模型测试失败' }
      - uses: actions/upload-artifact@v4
        with:
          name: mineru-windows
          path: output/MinerU-Windows-*.zip
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mineru-linux
          path: output/MinerU-UOS20-*.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: build-and-windows-reports
          path: |
            output/*.json
            output/SHA256SUMS.txt
          retention-days: 14
      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-failure-logs
          path: extracted/**/data/**/*.log
          if-no-files-found: ignore
  linux-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mineru-linux
          path: output
      - name: glibc 2.28 普通用户、禁网、只读模型测试
        run: |
          mkdir -p 'extracted/中文 空格' reports
          tar -xzf output/MinerU-UOS20-x64-Full.tar.gz -C 'extracted/中文 空格'
          tar -xzf output/MinerU-UOS20-x64-Runtime.tar.gz -C extracted
          chmod -R a+rwX extracted reports
          chmod -R a-w 'extracted/中文 空格/MinerU-UOS20-x64-Full/models'
          docker run --rm --network none --user 1000:1000 -v "$PWD/extracted:/app" -v "$PWD/tests:/tests:ro" -v "$PWD/reports:/reports" debian:buster bash -c '
            full="/app/中文 空格/MinerU-UOS20-x64-Full"
            cd "$full"
            ./start.sh --check
            export LD_LIBRARY_PATH="$full/runtime/python/lib:$full/lib"
            "$full/runtime/python/bin/python3.12" /tests/smoke_portable.py "$full" --advanced --output /reports/linux-full-test.json
          '
          docker run --rm --network none --user 1000:1000 -v "$PWD/extracted:/app" -v "$PWD/tests:/tests:ro" -v "$PWD/reports:/reports" debian:buster bash -c '
            runtime="/app/MinerU-UOS20-x64-Runtime"
            full="/app/中文 空格/MinerU-UOS20-x64-Full"
            export LD_LIBRARY_PATH="$runtime/runtime/python/lib:$runtime/lib"
            "$runtime/runtime/python/bin/python3.12" /tests/smoke_portable.py "$runtime" --gguf-dir "$full/models/GGUF" --onnx-dir "$full/models/MinerU-4_models_onnx" --output /reports/linux-external-models-test.json
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-reports
          path: |
            reports/*.json
            extracted/**/data/**/*.log
          if-no-files-found: ignore
          retention-days: 14
  release:
    name: 自动发布至 GitHub Releases
    needs: [build, linux-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: 下载 Windows 离线包产物
        uses: actions/download-artifact@v4
        with:
          name: mineru-windows
          path: release-assets
      - name: 下载 Linux 离线包产物
        uses: actions/download-artifact@v4
        with:
          name: mineru-linux
          path: release-assets
      - name: 下载构建与测试报告
        uses: actions/download-artifact@v4
        with:
          name: build-and-windows-reports
          path: release-assets
      - name: 下载 Linux 测试报告
        uses: actions/download-artifact@v4
        with:
          name: linux-test-reports
          path: release-reports
          if-no-files-found: ignore
      - name: 准备 Release 产物（处理 >2GiB 分卷与生成发布说明）
        run: |
          uv run --no-project --python 3.12 prepare_release.py --assets-dir release-assets --reports-dir release-reports
      - name: 确定 Release 标签与发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v4.0.12"
          fi

          TITLE="MinerU CPU 离线便携包 $TAG"
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=("--draft")
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=("--prerelease")
          fi

          echo "发布目标标签: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明并覆盖/上传资产..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-assets/RELEASE_NOTES.md "${FLAGS[@]}"
            gh release upload "$TAG" release-assets/dist/* --clobber
          else
            echo "创建新 Release $TAG 并上传资产..."
            gh release create "$TAG" release-assets/dist/* \
              --title "$TITLE" \
              --notes-file release-assets/RELEASE_NOTES.md \
              "${FLAGS[@]}"
          fi
